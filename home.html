<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOKUTO NO KEN LST - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --hokuto-red: #ff0000;
            --hokuto-gold: #ffcc00;
            --hokuto-blue: #0077ff;
            --hokuto-purple: #a020f0;
            --dark-bg: #050505;
        }

        body {
            /* Colore di sfondo trasparente per far vedere lo sfondo della pagina master */
            background-color: transparent; 
            color: white;
            font-family: 'Bangers', cursive, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Il resto degli stili del tuo menu (container, h1, slideshow, grid, buttons) */
        .container { position: relative; z-index: 10; text-align: center; padding: 40px 20px 80px 20px; width: 100%; max-width: 900px; }
        h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 20px 0; color: white; text-shadow: 0 0 20px var(--hokuto-red); letter-spacing: 5px; animation: shake 0.5s infinite alternate; }

        .glow-wrapper { position: relative; width: 100%; max-width: 600px; aspect-ratio: 16 / 9; margin: 0 auto 30px auto; padding: 6px; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.8); overflow: hidden; border-radius: 8px; }
        .glow-wrapper::before { content: ''; position: absolute; width: 200%; height: 200%; background: conic-gradient(transparent, var(--hokuto-red), var(--hokuto-gold), transparent, transparent, var(--hokuto-red), transparent); animation: rotateGlow 4s linear infinite; }
        .slideshow-container { position: relative; width: 100%; height: 100%; background: #000; z-index: 2; overflow: hidden; border-radius: 4px; }
        .mySlides { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; }
        .mySlides.active { opacity: 1; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; }
        .btn { text-decoration: none; color: white; transition: 0.3s; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); display: flex; align-items: center; justify-content: center; padding: 12px; font-size: 1.4rem; }
        .btn-play { grid-column: span 2; font-size: 2.2rem; background: linear-gradient(45deg, #800000, #ff4500); border: 2px solid var(--hokuto-gold); box-shadow: 0 0 15px rgba(255, 69, 0, 0.5); }
        .btn-install { background: #111; border: 2px solid var(--hokuto-red); }
        .btn-update { background: #111; border: 2px solid var(--hokuto-blue); }
        .btn-quiz { background: #111; border: 2px solid var(--hokuto-gold); } /* Stilizzato nel tuo index.html */
        .btn-announcer { grid-column: span 2; background: #111; border: 2px solid var(--hokuto-purple); }
        .btn:hover { transform: scale(1.05); filter: brightness(1.3); }
        .btn-play:hover { background: var(--hokuto-gold); color: black; }
        .btn-quiz:hover { background: var(--hokuto-gold); color: black; }

        .footer-links { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .btn-sub { color: #888; text-decoration: none; transition: 0.3s; font-size: 1.1rem; }
        .btn-sub:hover { color: white; text-shadow: 0 0 10px white; }

        /* Animazioni specifiche per il contenuto dell'iframe */
        @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shake { 0% { transform: skewX(-1deg); } 100% { transform: skewX(1deg); } }

        /* Responsive */
        @media (max-width: 700px) {
            .menu-grid { grid-template-columns: 1fr; }
            .btn-play, .btn-announcer { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HOKUTO NO KEN LST</h1>
        
        <div class="glow-wrapper">
            <div class="slideshow-container">
                <img src="media/screen1.jpg" class="mySlides active">
                <img src="media/screen2.jpg" class="mySlides">
                <img src="media/screen3.jpg" class="mySlides">
                <img src="media/screen4.jpg" class="mySlides">
            </div>
        </div>

        <div class="menu-grid">
            <a href="gioco.html" class="btn btn-play">IL NOSTRO GIOCO</a>
            
            <a href="download.html" class="btn btn-install">DOWNLOAD GIOCO / ADD-ONS</a>
            
            <a href="aggiornamento.html" class="btn btn-update">AGGIORNA</a>
            <a href="quiz.html" class="btn btn-quiz">QUIZ DI HOKUTO</a>
        </div>
        </div>

        <div class="footer-links">
            <a href="manuale.pdf" class="btn-sub" target="_blank">MANUALE</a>
            <a href="https://www.facebook.com/Mikehaggar43/" target="_blank" class="btn-sub">COMMUNITY</a>
            <a href="https://www.tiktok.com/@hokutonokenlst" class="btn-sub">SOCIAL</a>
            <a href="credits.txt" class="btn-sub" target="_blank">CREDITI</a>
            <a href="mailto:hokutonokenlst@outlook.it?subject=Contatto%20dal%20sito%20Hokuto%20LST" class="btn-sub">CONTATTACI</a>
        </div>

    </div>

    <script>
        let slideIndex = 0;
        const slides = document.querySelectorAll(".mySlides");
        function showSlides() {
            if (slides.length === 0) return; // Assicurati che ci siano slide
            slides.forEach(s => s.classList.remove("active"));
            slides[slideIndex].classList.add("active");
            slideIndex = (slideIndex + 1) % slides.length;
            setTimeout(showSlides, 4000);
        }
        showSlides();
    </script>

</body>
</html>

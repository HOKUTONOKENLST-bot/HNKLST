    <style>

            --hokuto-gold: #ffcc00;
            --hokuto-blue: #0077ff;
            --hokuto-green: #00cc44;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Bangers', cursive, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            text-transform: uppercase;
            min-height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }

        /* --- TITOLO PAGINA --- */
        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--hokuto-gold);
            text-shadow: 0 0 15px var(--hokuto-red), 3px 3px 0px #800000;
            margin-top: 0;
            margin-bottom: 35px;
            text-align: center;
            border-bottom: 3px solid var(--hokuto-red);
            padding-bottom: 10px;
            width: 85%;
            max-width: 800px;
            letter-spacing: 2px;
        }

        /* --- CONTENITORE PULSANTI DOWNLOAD --- */
        .download-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 90%;
            max-width: 650px;
            margin-bottom: 35px;
        }

        /* --- STILE GENERALE PULSANTI DOWNLOAD --- */
        .dl-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            padding: 18px 25px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            text-align: center;
            clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
        }

        .dl-btn .btn-title {
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .dl-btn .btn-subtitle {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #eee;
            text-transform: none;
            opacity: 0.9;
        }

        /* --- PULSANTE 1: PC / WINDOWS / LINUX / MAC --- */
        .dl-pc {
            background: linear-gradient(135deg, #b30000 0%, #ff1a1a 50%, #800000 100%);
            border: 2px solid var(--hokuto-gold);
        }

        .dl-pc:hover {
            background: linear-gradient(135deg, #ff1a1a 0%, #ff4d4d 50%, #b30000 100%);
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 0 0 10px var(--hokuto-gold);
            border-color: white;
        }

        /* --- PULSANTE 2: ANDROID --- */
        .dl-android {
            background: linear-gradient(135deg, #007722 0%, #00b333 50%, #004d1a 100%);
            border: 2px solid #55ff88;
        }

        .dl-android:hover {
            background: linear-gradient(135deg, #00b333 0%, #00e640 50%, #007722 100%);
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 230, 64, 0.8), 0 0 10px white;
            border-color: white;
        }

        /* --- PULSANTE TORNA ALLA HOME --- */
        .back-btn {
            background: linear-gradient(180deg, var(--hokuto-blue), #004488);
            color: white;
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            padding: 10px 30px;
            border: 2px solid var(--hokuto-blue);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
        }

        .back-btn:hover {
            background: linear-gradient(180deg, #00aaff, #0077ff);
            border-color: white;
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.7);
            transform: scale(1.05);
            color: white;
        }

        @media (max-width: 600px) {
            .dl-btn {
                clip-path: none;
                border-radius: 6px;
            }
            .back-btn {
                clip-path: none;
                border-radius: 6px;
            }
        }
    </style>
</head>
